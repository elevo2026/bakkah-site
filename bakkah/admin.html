<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BAKKAH · Seller area</title>
<link rel="icon" href="assets/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a08;--panel:#15130f;--panel2:#1c1913;--ink:#f3ead6;--muted:#a89f8a;--line:#2e2a20;--gold:#d4af37;--gold2:#f6e27a;--ok:#3fbf7a;--danger:#e0624f;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--gold)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
header{position:sticky;top:0;z-index:20;background:rgba(11,10,8,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:62px}
.bar img{width:42px;height:42px;border-radius:50%}
.bar h1{font-size:22px;line-height:1.1;flex:1}
.bar small{display:block;font:500 10px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mode{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:99px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,#a67c1a,#f6e27a 45%,#c9a227 70%,#8a6a1f);color:#111}
.btn-line{border:1px solid var(--line);background:var(--panel)}
.btn-line:hover{border-color:var(--gold)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:wait}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tab[aria-selected=true]{background:var(--gold);color:#111;border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:22px;margin-bottom:4px}
.hint{color:var(--muted);font-size:13px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;letter-spacing:.04em}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=url],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px}
textarea{resize:vertical;min-height:80px}
input[type=color]{width:56px;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:140px}
.item{display:grid;grid-template-columns:44px 56px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.item.off{opacity:.55}.item.hid{opacity:.5;background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 8px,#1a1a1a 8px,#1a1a1a 16px)}.pill.hidp{background:#2a2a2a;color:#ccc;border-color:#555}
.vis{display:flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer}.vis input{width:26px;height:26px;accent-color:var(--gold);cursor:pointer}.seg{display:flex;gap:4px;flex-wrap:wrap}.vbar{gap:6px}
.thumb{width:56px;height:72px;border-radius:6px;object-fit:cover;background:#16120a}
.item h3{font-size:15px;font-weight:600;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-inline-end:4px;border:1px solid var(--line)}
.pill.promo{background:#3a1d17;color:#ff9b88;border-color:#5a2b22}.pill.star{background:#3a3010;color:var(--gold2);border-color:#5a4a14}.pill.no{background:#331612;color:var(--danger)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel2)}
.ib:hover{border-color:var(--gold)}.ib[disabled]{opacity:.25;cursor:default}
.demo{background:#2a2410;border-bottom:1px solid #4a3f14;font-size:13px;padding:8px 0;color:#e8d38a}
.sw{display:flex;align-items:center;gap:8px;min-height:42px}
.sw input{width:20px;height:20px;accent-color:var(--gold)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:0;width:min(720px,96vw);max-height:92vh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlg{padding:18px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.ph{position:relative}.ph img{width:80px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#16120a}
.ph button{position:absolute;top:-6px;inset-inline-end:-6px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;font-size:14px}
.imgrow{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;margin-bottom:12px}
.imgrow img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 18px;border-radius:99px;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}#toast.err{background:var(--danger);color:#fff}
.login{max-width:380px;margin:12vh auto;text-align:center}
.login img{width:110px;height:110px;border-radius:50%;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}.tbl input{min-height:36px;padding:6px 8px}
details.tgrp{margin-top:8px}details.tgrp>summary{list-style:revert}.fgroup{margin-top:18px;font:600 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:6px}
label.lc{margin:0;font-size:14px;color:var(--ink)}
.tblw{overflow-x:auto}
code{unicode-bidi:isolate;direction:ltr;display:inline-block}
input[type=url],input[type=email],input[type=number],input[type=password]{direction:ltr;text-align:start}
[dir=rtl] input[type=url],[dir=rtl] input[type=email],[dir=rtl] input[type=number],[dir=rtl] input[type=password]{text-align:right}
[dir=rtl] label,[dir=rtl] .bar small,[dir=rtl] .fgroup{letter-spacing:0;text-transform:none}
[dir=rtl] .bar small{font-size:11px}
.lsw{display:inline-flex;gap:4px;flex:none}
.lsw button{min-width:38px;height:30px;padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font:600 12px Inter,sans-serif}
.lsw button[aria-pressed=true]{background:var(--gold);color:#111;border-color:var(--gold)}
.loginlang{text-align:end;padding-top:14px}
.bar{min-width:0}.bar h1{min-width:0}
@media(max-width:640px){.bar{gap:6px;flex-wrap:wrap;height:auto;padding:8px 0}.bar .btn-sm{height:30px;padding:0 10px;font-size:12px}.bar h1{font-size:19px;flex:1 1 90px}.item{grid-template-columns:44px 48px 1fr;}.vis{width:44px;height:44px}.vis input{width:28px;height:28px}.vbar .btn-sm,.seg .btn-sm{height:40px;min-height:40px}.item .acts{grid-column:1/-1;justify-content:flex-start}.thumb{width:48px;height:62px}.btn{white-space:normal;min-height:42px;height:auto;padding-top:6px;padding-bottom:6px}.dlg{padding:14px}}
</style>
</head>
<body>
<div id="login" class="wrap" hidden>
  <div class="loginlang"><div class="lsw" role="group"><button type="button" data-lang="ar">AR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></div></div>
  <div class="login card">
    <img src="assets/img/logo.jpg" alt="BAKKAH">
    <h1 class="serif" style="font-size:28px" data-tx="title"></h1>
    <p class="hint" id="loginHint"></p>
    <form id="loginForm">
      <div id="emailRow" hidden><label for="lEmail" data-tx="email"></label><input id="lEmail" type="email" autocomplete="username"></div>
      <label for="lPw" id="lPwLabel" data-tx="pw"></label><input id="lPw" type="password" autocomplete="current-password">
      <div id="pw2Row" hidden><label for="lPw2" data-tx="pw2"></label><input id="lPw2" type="password" autocomplete="new-password"></div>
      <p id="lErr" class="hint" style="color:var(--danger);margin-top:8px"></p>
      <button class="btn btn-gold" style="width:100%;margin-top:8px" id="lBtn"></button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header><div class="wrap bar">
    <img src="assets/img/logo.jpg" alt=""><h1 class="serif">BAKKAH<small data-tx="title"></small></h1>
    <span class="mode" id="modeBadge"></span>
    <div class="lsw" role="group"><button type="button" data-lang="ar">AR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></div>
    <a class="btn btn-line btn-sm" href="index.html" target="_blank" rel="noopener" data-tx="site"></a>
    <button class="btn btn-line btn-sm" id="logout" data-tx="out"></button>
  </div></header>
  <div class="demo" id="demoBar"><div class="wrap" id="demoMsg"></div></div>
  <main class="wrap">
    <div class="tabs" role="tablist" id="tabs"></div>
    <section id="view"></section>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>

<script src="config.js"></script>

      <label class="vis" title="${esc(t("visToggle"))}"><input type="checkbox" data-vis="${esc(p.id)}" ${hid ? "" : "checked"} aria-label="${esc(t("visToggle") + " : " + p.nom)}"></label>
      <img class="thumb" src="${esc(thumb(p))}" alt=""><div><h3>${esc(p.nom)}</h3>

      <div class="acts"><button class="ib" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="${t("up")}">↑</button><button class="ib" data-down="${i}" ${i === PRODS.length - 1 ? "disabled" : ""} aria-label="${t("down")}">↓</button>
      <button class="btn btn-line btn-sm" data-edit="${esc(p.id)}">${t("edit")}</button></div></div>`; }).join("") || `<div class="card hint">${t("none")}</div>`}`;

  const setVis = async (ps, v, box) => {
    const prev = ps.map(p => p.visible); let n = 0;

    catch (e) {
      console.warn(e);

}

  <div class="row"><div><label>${t("prim")}</label><input type="color" data-c="couleur1" data-id="${esc(p.id)}" value="${p.couleur1}"></div><div><label>${t("sec")}</label><input type="color" data-c="couleur2" data-id="${esc(p.id)}" value="${p.couleur2}"></div>
  <div class="grow"><label>${t("head")}</label><input type="text" data-n="tete" data-id="${esc(p.id)}" value="${esc(p.notes.tete)}"></div><div class="grow"><label>${t("heart")}</label><input type="text" data-n="coeur" data-id="${esc(p.id)}" value="${esc(p.notes.coeur)}"></div><div class="grow"><label>${t("base")}</label><input type="text" data-n="fond" data-id="${esc(p.id)}" value="${esc(p.notes.fond)}"></div></div></div>`).join("")}
  <div class="row"><select id="addV" class="grow"><option value="">${t("addV")}</option>${others.map(p => `<option value="${esc(p.id)}">${esc(p.nom)}${p.visible === false ? " (" + t("hidden") + ")" : ""}</option>`).join("")}</select><button class="btn btn-line" id="addVb">${t("add")}</button><button class="btn btn-gold" id="saveV">${t("save")}</button></div></div>`;
  const v = $("#view"), get = id => PRODS.find(p => p.id === id);
  v.oninput = e => { const el = e.target, p = get(el.dataset.id); if (!p) return; if (el.dataset.c) p[el.dataset.c] = el.value; if (el.dataset.n) p.notes[el.dataset.n] = el.value; };
  v.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.mv){ const i = feat.findIndex(p => p.id === b.dataset.id), j = i + +b.dataset.mv; feat.forEach((p, k) => p.vedette_ordre = k); const tmp = feat[i].vedette_ordre; feat[i].vedette_ordre = feat[j].vedette_ordre; feat[j].vedette_ordre = tmp; vedettes(); }
    if (b.dataset.rm){ const p = get(b.dataset.rm); p.vedette = false; p.vedette_ordre = 99; vedettes(); }
    if (b.id === "addVb" && $("#addV").value){ const p = get($("#addV").value); p.vedette = true; p.vedette_ordre = feat.length + 1; vedettes(); }
    if (b.id === "saveV") guard(async () => { if (!PRODS.some(p => p.vedette && p.visible !== false)) throw new Error(t("vErr")); await D.saveProducts(PRODS); await reloadP(); toast(t("vSaved")); vedettes(); }); };
}

/* ---------- Textes & FAQ (3 langues) ---------- */
function textes(){
  const groups = [...new Set(D.TEXT_KEYS.map(x => x.group))];
  const field = (k, l, T) => { const cur = S.textes[k.key] || {}, val = cur[l] ?? k[l]; const dir = dirOf(l);
    return `<div><label>${T}</label>${k.multi ? `<textarea${dir} data-t="${esc(k.key)}" data-l="${l}">${esc(val)}</textarea>` : `<input${dir} type="text" data-t="${esc(k.key)}" data-l="${l}" value="${esc(val)}">`}</div>`; };
  $("#view").innerHTML = `<div class="card"><h2 class="serif">${t("tH")}</h2><p class="hint">${t("tHint")}</p>
  <div class="row" style="margin-bottom:10px"><input class="grow" type="text" id="tq" placeholder="${esc(t("tSearch"))}"></div>
  ${groups.map(g => `<details class="tgrp"><summary class="fgroup" style="cursor:pointer">${esc(grp(g))}</summary>${D.TEXT_KEYS.filter(k => k.group === g).map(k => `<div class="trow" data-search="${esc((k.key + " " + k.fr + " " + k.en + " " + k.ar).toLowerCase())}"><div class="meta" style="margin-top:12px" dir="ltr"><code>${esc(k.key)}</code></div><div class="g3">${field(k, "fr", "Français (FR)")}${field(k, "en", "English (EN)")}${field(k, "ar", "العربية (AR)")}</div></div>`).join("")}</details>`).join("")}
  <details class="tgrp" open><summary class="fgroup" style="cursor:pointer">${t("faq")}</summary><div id="faqBox"></div><button class="btn btn-line btn-sm" id="addFaq" style="margin-top:8px">${t("addFaq")}</button></details>
  <div class="row" style="margin-top:16px"><button class="btn btn-gold" id="saveT">${t("saveT")}</button></div></div>`;
  const tri = (f, i, k, multi, label) => `<div class="g3">${L3.map(([l, T]) => { const val = (f[k] && f[k][l]) || ""; const dir = dirOf(l); return `<div><label>${label} (${T})</label>${multi ? `<textarea${dir} data-f="${k}" data-fl="${l}" data-i="${i}">${esc(val)}</textarea>` : `<input${dir} type="text" data-f="${k}" data-fl="${l}" data-i="${i}" value="${esc(val)}">`}</div>`; }).join("")}</div>`;
  const drawFaq = () => { $("#faqBox").innerHTML = S.faq.map((f, i) => `<div class="card" style="background:var(--panel2)">${tri(f, i, "q", false, t("question"))}${tri(f, i, "a", true, t("answer"))}
    <div class="row" style="margin-top:6px"><button class="ib" data-fm="-1" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="${t("up")}">↑</button><button class="ib" data-fm="1" data-i="${i}" ${i === S.faq.length - 1 ? "disabled" : ""} aria-label="${t("down")}">↓</button><button class="btn btn-danger btn-sm" data-fd="${i}">${t("del")}</button></div></div>`).join(""); };
  S.faq = S.faq.map(f => ({ q: typeof f.q === "string" ? { fr: f.q, en: "", ar: f.q_ar || "" } : f.q, a: typeof f.a === "string" ? { fr: f.a, en: "", ar: f.a_ar || "" } : f.a }));
  drawFaq();
  const v = $("#view");
  $("#tq").oninput = e => { const q = e.target.value.trim().toLowerCase(); v.querySelectorAll(".trow").forEach(r => r.hidden = !!q && !r.dataset.search.includes(q)); if (q) v.querySelectorAll("details.tgrp").forEach(d => { if (d.querySelector(".trow:not([hidden])")) d.open = true; }); };
  v.oninput = e => { const el = e.target; if (el.dataset.t){ const o = S.textes[el.dataset.t] = S.textes[el.dataset.t] || {}; o[el.dataset.l] = el.value; } if (el.dataset.f) { const f = S.faq[+el.dataset.i]; (f[el.dataset.f] = f[el.dataset.f] || {})[el.dataset.fl] = el.value; } };
  v.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.fm){ const i = +b.dataset.i, j = i + +b.dataset.fm; [S.faq[i], S.faq[j]] = [S.faq[j], S.faq[i]]; drawFaq(); }
    if (b.dataset.fd){ S.faq.splice(+b.dataset.fd, 1); drawFaq(); }
    if (b.id === "addFaq"){ S.faq.push({ q: { fr: "", en: "", ar: "" }, a: { fr: "", en: "", ar: "" } }); drawFaq(); }
    if (b.id === "saveT"){ S.faq = S.faq.filter(f => (f.q.fr || f.q.en || f.q.ar) && (f.a.fr || f.a.en || f.a.ar)); saveS(); drawFaq(); } };
}

/* ---------- Images ---------- */
function images(){
  const slots = [["logo", t("sLogo")], ["og", t("sOg")], ...[0,1,2,3,4].map(i => ["b" + i, t("sShop", { n: i + 1 })])];
  const get = k => k === "logo" ? S.images.logo : k === "og" ? S.images.og : S.images.boutique[+k.slice(1)];
  const set = (k, val) => { if (k === "logo") S.images.logo = val; else if (k === "og") S.images.og = val; else S.images.boutique[+k.slice(1)] = val; };
  $("#view").innerHTML = `<div class="card"><h2 class="serif">${t("iH")}</h2><p class="hint">${t("iHint")}</p>
  ${slots.map(([k, l]) => `<div class="imgrow"><img src="${esc(get(k))}" alt=""><div><b>${l}</b><div class="row" style="margin-top:6px"><input type="file" accept="image/*" data-file="${k}" hidden><button class="btn btn-line btn-sm" data-up="${k}">${t("replace")}</button><input type="url" class="grow" data-url="${k}" value="${/^data:/.test(get(k)) ? "" : esc(get(k))}" placeholder="${esc(t("imgUrl"))}"><button class="btn btn-line btn-sm" data-ok="${k}">OK</button></div></div></div>`).join("")}
  <div class="row"><button class="btn btn-gold" id="saveI">${t("save")}</button><button class="btn btn-line" id="defI">${t("resetImg")}</button></div></div>`;
  const v = $("#view");
  v.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.up) v.querySelector(`[data-file="${b.dataset.up}"]`).click();
    if (b.dataset.ok){ set(b.dataset.ok, v.querySelector(`[data-url="${b.dataset.ok}"]`).value.trim() || get(b.dataset.ok)); images(); }
    if (b.id === "saveI") saveS();
    if (b.id === "defI"){ S.images = JSON.parse(JSON.stringify(D.DEFAULT_SETTINGS.images)); images(); } };
  v.onchange = e => { const k = e.target.dataset.file; if (!k) return; guard(async () => { set(k, await D.uploadImage(e.target.files[0], k === "logo" ? 600 : 1100)); images(); toast(t("imgReady")); }); };
}

/* ---------- Liens & contact ---------- */
function liens(){
  const L = S.liens, f = (id, label, val, ph, type) => `<div><label>${label}</label><input type="${type || "text"}" id="${id}" value="${esc(val)}" placeholder="${esc(ph || "")}"></div>`;
  $("#view").innerHTML = `<div class="card"><h2 class="serif">${t("lH")}</h2><p class="hint">${t("lHint")}</p>
  <div class="fgroup">${t("gWa")}</div>
  <div class="g2">${f("s_wa", t("waNum"), S.whatsapp, "212671501152")}${f("s_devise", t("currency"), S.devise, "DH")}</div>
  <div class="fgroup">${t("gShop")}</div><div class="g2">${f("s_nom", t("shopName"), S.nom)}${f("s_tel", t("phone"), S.telephone, "+212 6 71 50 11 52")}${f("s_adr", t("addr"), S.adresse)}${f("s_hor", t("hours"), S.horaires)}</div>
  <div class="fgroup">${t("gLinks")}</div><div class="g2">${f("l_instagram", "Instagram", L.instagram, "https://instagram.com/…", "url")}${f("l_tiktok", "TikTok", L.tiktok, "https://tiktok.com/@…", "url")}${f("l_snapchat", "Snapchat", L.snapchat, "https://snapchat.com/add/…", "url")}${f("l_facebook", "Facebook", L.facebook, "https://facebook.com/…", "url")}
  ${f("l_whatsapp", t("waLink"), L.whatsapp, "https://wa.me/…", "url")}${f("l_avis", t("reviews"), L.avis, t("reviewsPh"), "url")}${f("l_itineraire", t("route"), L.itineraire, t("routePh"), "url")}</div>
  <div class="sw" style="margin-top:12px"><input type="checkbox" id="s_news" ${S.newsletter ? "checked" : ""}><label for="s_news" class="lc">${t("news")}</label></div>
  <div class="row" style="margin-top:14px"><button class="btn btn-gold" id="saveL">${t("save")}</button></div></div>`;
  $("#saveL").onclick = () => { const g = id => $("#" + id).value.trim();
    Object.assign(S, { whatsapp: g("s_wa").replace(/\D/g, ""), devise: g("s_devise"), nom: g("s_nom") || "BAKKAH", telephone: g("s_tel"), adresse: g("s_adr"), horaires: g("s_hor"), newsletter: $("#s_news").checked });
    const bad = []; const lk = {};
    ["instagram","tiktok","snapchat","facebook","whatsapp","avis","itineraire"].forEach(k => { const val = g("l_" + k); if (val && !D.safeLink(val)) { bad.push(k); $("#l_" + k).style.borderColor = "#c0392b"; } else { lk[k] = val; $("#l_" + k).style.borderColor = ""; } });
    if (bad.length) return toast(t("linkBad", { k: bad.join(", ") }), true);
    Object.assign(S.liens, lk); saveS(); };
}

/* ---------- Données & sécurité ---------- */
async function donnees(){
  const subs = await D.getSubscribers();
  $("#view").innerHTML = `<div class="card"><h2 class="serif">${t("bH")}</h2><p class="hint">${t("bHint")}</p>
  <div class="row"><button class="btn btn-line" id="exp">${t("exp")}</button><input type="file" id="impF" accept="application/json" hidden><button class="btn btn-line" id="imp">${t("imp")}</button>${D.mode === "local" ? `<button class="btn btn-danger" id="rst">${t("rst")}</button>` : ""}</div></div>
  <div class="card"><h2 class="serif">${t("nlH")}</h2><p class="hint">${t("subs", { n: subs.length })}</p>${subs.length ? `<button class="btn btn-line btn-sm" id="csv">${t("csv")}</button>` : ""}</div>
  <div class="card"><h2 class="serif">${t("pwH")}</h2>${D.mode === "local" ? `<p class="hint">${t("pwLocal")}</p><div class="g2"><div><label>${t("pwNew")}</label><input type="password" id="np"></div><div><label>${t("pwConf")}</label><input type="password" id="np2"></div></div><div class="row" style="margin-top:12px"><button class="btn btn-gold" id="chpw">${t("pwChange")}</button></div>` : `<p class="hint">${t("pwLive")}</p>`}</div>`;
  const dl = (name, text, type) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $("#exp").onclick = () => guard(async () => dl("bakkah-sauvegarde.json", JSON.stringify(await D.exportAll(), null, 1), "application/json"));
  $("#imp").onclick = () => $("#impF").click();
  $("#impF").onchange = e => guard(async () => { const d = JSON.parse(await e.target.files[0].text()); if (!confirm(t("impConfirm"))) return; await D.importAll(d); location.reload(); });
  if ($("#rst")) $("#rst").onclick = () => { if (confirm(t("rstConfirm"))){ D.resetDemo(); location.reload(); } };
  if ($("#csv")) $("#csv").onclick = () => dl("newsletter.csv", "email,date\n" + subs.map(s => `${s.email},${s.date || s.created_at || ""}`).join("\n"), "text/csv");
  if ($("#chpw")) $("#chpw").onclick = () => guard(async () => { const a = $("#np").value; if (a.length < 6) throw new Error(t("pwMin")); if (a !== $("#np2").value) throw new Error(t("pwDiff")); await D.setPassword(a); toast(t("pwChanged")); });
}

boot();
})();
</script>
